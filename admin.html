<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队官网 管理后台</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;min-height:100vh;color:#1a1a1a}
.header{background:#fff;border-bottom:1px solid #e8e8e5;padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.header-dot{width:10px;height:10px;background:#E24B4A;border-radius:50%}
.header-title{font-size:15px;font-weight:600;flex:1}
.api-status{font-size:12px;padding:4px 10px;border-radius:12px;white-space:nowrap}
.api-status.ok{background:#e8f5e9;color:#2e7d32}
.api-status.none{background:#fff3e0;color:#e65100}
.api-toggle{font-size:12px;color:#888;cursor:pointer;padding:5px 10px;border:1px solid #e0e0e0;border-radius:6px;background:#f9f9f9}
.api-toggle:hover{background:#f0f0f0}
.api-bar{background:#fffbf0;border-bottom:1px solid #f0e8c8;padding:14px 24px;display:none;flex-direction:column;gap:10px}
.api-bar.show{display:flex}
.api-row{display:flex;gap:8px;align-items:center}
.api-row label{font-size:12px;color:#888;white-space:nowrap;font-weight:500;width:130px;flex-shrink:0}
.api-row input{flex:1;padding:7px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:monospace}
.api-row input:focus{outline:none;border-color:#E24B4A}
.api-row button{padding:7px 14px;background:#E24B4A;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap}
.api-note{font-size:12px;color:#888;padding:6px 0 0 138px;line-height:1.5}
.tabs{background:#fff;border-bottom:1px solid #e8e8e5;padding:0 24px;display:flex}
.tab{padding:13px 18px;font-size:13px;color:#888;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;font-weight:500}
.tab.active{color:#E24B4A;border-bottom-color:#E24B4A}
.tab:hover:not(.active){color:#444}
.content{padding:20px 24px;max-width:860px;margin:0 auto}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;padding:20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px}
.field{margin-bottom:13px}
.lbl{display:block;font-size:12px;font-weight:500;color:#666;margin-bottom:5px}
.lbl span{color:#aaa;font-weight:400}
input[type=text],input[type=password],textarea,select{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fff;transition:border .15s;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:#E24B4A;box-shadow:0 0 0 3px rgba(226,75,74,.08)}
textarea{min-height:160px;resize:vertical;line-height:1.6}
.input-row{display:flex;gap:8px}
.input-row input{flex:1}
.img-upload-area{border:2px dashed #ddd;border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa;position:relative;overflow:hidden}
.img-upload-area:hover{border-color:#E24B4A;background:#fff8f8}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-text{font-size:13px;color:#888;line-height:1.6}
.upload-text strong{color:#E24B4A}
.img-preview{margin-top:12px;position:relative}
.img-preview img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;display:block}
.img-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.upload-prog{font-size:12px;margin-top:6px;display:none}
.ai-box{background:#f0f7ff;border:1px solid #c8dff7;border-radius:10px;padding:16px;margin:16px 0;display:none}
.ai-box-title{font-size:11px;font-weight:600;color:#1565c0;text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.ai-field{margin-bottom:12px}
.btn{padding:9px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-red{background:#E24B4A;color:#fff}.btn-red:hover{background:#c0392b}.btn-red:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:#1565c0;color:#fff}.btn-blue:hover{background:#0d47a1}.btn-blue:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:#27ae60;color:#fff}.btn-green:hover{background:#229954}
.btn-ghost{background:#f5f5f5;color:#555;border:1px solid #e0e0e0}.btn-ghost:hover{background:#ececec}
.btn-danger{background:#fdecea;color:#c0392b;border:1px solid #f5c6c6;font-size:12px;padding:5px 11px}.btn-danger:hover{background:#fad7d5}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f0f0}
.list-item:last-child{border-bottom:none}
.list-thumb{width:60px;height:44px;object-fit:cover;border-radius:7px;background:#f0f0f0;flex-shrink:0}
.list-info{flex:1;min-width:0}
.list-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:12px;color:#999;margin-top:2px}
.list-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.list-link{font-size:12px;color:#1a73e8;text-decoration:none}.list-link:hover{text-decoration:underline}
.badge{display:inline-block;background:#f0f0f0;color:#888;border-radius:10px;font-size:11px;padding:2px 8px;margin-left:6px}
.empty{text-align:center;padding:36px;color:#bbb;font-size:13px}
.preview{border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;margin-top:14px}
.preview-img{width:100%;height:180px;object-fit:cover;display:block;background:#f0f0f0}
.preview-body{padding:14px}
.preview-addr{font-size:15px;font-weight:600;margin-bottom:3px}
.preview-sub{font-size:12px;color:#999;margin-bottom:10px}
.preview-stats{display:flex;gap:16px;font-size:13px;color:#555;margin-bottom:8px}
.preview-price{font-size:14px;font-weight:600;color:#E24B4A}
.preview-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #f0f0f0;background:#fafafa}
.dup-warn{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;font-size:13px;color:#f57f17;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:340px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:8px}
.modal-body{font-size:13px;color:#666;line-height:1.6;margin-bottom:22px}
.modal-btns{display:flex;gap:8px}
.toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:500;z-index:300;animation:ti .2s ease;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.toast.ok{background:#27ae60;color:#fff}
.toast.err{background:#E24B4A;color:#fff}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.status-line{font-size:12px;color:#999;margin-top:8px;min-height:16px}
.status-line.err{color:#E24B4A}
.hint{font-size:12px;color:#aaa;margin-top:10px;padding:10px;background:#f9f9f9;border-radius:6px;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div class="header-dot"></div>
  <span class="header-title">团队官网 管理后台</span>
</div>

<div class="content">

  <!-- LISTINGS TAB -->
  <div id="tab-listings">
    <div class="card">
      <div class="card-title">新增 Listing</div>
      <div id="dup-warn" style="display:none;margin-bottom:10px" class="dup-warn">⚠ 该地址已存在于数据库，请检查是否重复！</div>
      <div class="input-row" style="flex-wrap:wrap;gap:8px">
        <div class="field" style="flex:2;min-width:200px"><label class="lbl">地址 *</label><input type="text" id="m-address" placeholder="例：12 Example St, Remuera" /></div>
        <div class="field" style="flex:1;min-width:120px"><label class="lbl">区域 Suburb</label><input type="text" id="m-suburb" placeholder="Remuera" /></div>
      </div>
      <div class="input-row" style="gap:8px">
        <div class="field" style="flex:1"><label class="lbl">🛏 卧室</label><input type="text" id="m-bed" placeholder="3" /></div>
        <div class="field" style="flex:1"><label class="lbl">🚿 卫浴</label><input type="text" id="m-bath" placeholder="2" /></div>
        <div class="field" style="flex:1"><label class="lbl">🚗 车位</label><input type="text" id="m-garage" placeholder="1" /></div>
      </div>
      <div class="input-row" style="gap:8px">
        <div class="field" style="flex:1"><label class="lbl">地面积</label><input type="text" id="m-land" placeholder="600 m²" /></div>
        <div class="field" style="flex:1"><label class="lbl">建筑面积</label><input type="text" id="m-build" placeholder="180 m²" /></div>
        <div class="field" style="flex:1"><label class="lbl">价格</label><input type="text" id="m-price" placeholder="Deadline Sale" /></div>
      </div>
      <div class="field"><label class="lbl">图片 URL <span>（可选）</span></label><input type="text" id="m-img" placeholder="https://..." /></div>
      <div class="field"><label class="lbl">Ray White 链接 <span>（可选）</span></label><input type="text" id="m-rw-url" placeholder="https://www.raywhite.co.nz/..." /></div>
      <div class="field"><label class="lbl">简介 <span>（可选）</span></label><textarea id="m-desc" style="min-height:70px" placeholder="物业简介..."></textarea></div>
      <button class="btn btn-green" onclick="saveManual()">✓ 发布 Listing</button>
    </div>
    <div class="card">
      <div class="card-title">当前 Listings <span class="badge" id="lc">0</span></div>
      <div id="listings-list"><div class="empty">加载中...</div></div>
    </div>
  </div>

</div>

<div class="overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-title">确认删除</div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-btns">
      <button class="btn btn-danger" style="flex:1;padding:10px" onclick="doDelete()">确认删除</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<!-- Edit Drawer -->
<div class="overlay" id="edit-overlay" style="display:none;align-items:flex-end" onclick="if(event.target===this)closeEdit()">
  <div style="background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:860px;margin:0 auto;max-height:90vh;overflow-y:auto;padding:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <span style="font-size:15px;font-weight:600">编辑 Listing</span>
      <button class="btn btn-ghost" style="padding:5px 12px" onclick="closeEdit()">✕ 关闭</button>
    </div>
    <div class="input-row" style="flex-wrap:wrap;gap:8px">
      <div class="field" style="flex:2;min-width:200px"><label class="lbl">地址 *</label><input type="text" id="e-address" /></div>
      <div class="field" style="flex:1;min-width:120px"><label class="lbl">区域 Suburb</label><input type="text" id="e-suburb" /></div>
    </div>
    <div class="input-row" style="gap:8px">
      <div class="field" style="flex:1"><label class="lbl">🛏 卧室</label><input type="text" id="e-bed" /></div>
      <div class="field" style="flex:1"><label class="lbl">🚿 卫浴</label><input type="text" id="e-bath" /></div>
      <div class="field" style="flex:1"><label class="lbl">🚗 车位</label><input type="text" id="e-garage" /></div>
    </div>
    <div class="input-row" style="gap:8px">
      <div class="field" style="flex:1"><label class="lbl">地面积</label><input type="text" id="e-land" /></div>
      <div class="field" style="flex:1"><label class="lbl">建筑面积</label><input type="text" id="e-build" /></div>
      <div class="field" style="flex:1"><label class="lbl">价格</label><input type="text" id="e-price" /></div>
    </div>
    <div class="field"><label class="lbl">图片 URL</label><input type="text" id="e-img" /></div>
    <div class="field"><label class="lbl">Ray White 链接</label><input type="text" id="e-rw-url" /></div>
    <div class="field"><label class="lbl">简介</label><textarea id="e-desc" style="min-height:80px"></textarea></div>
    <div style="display:flex;gap:8px;padding-top:4px">
      <button class="btn btn-green" style="flex:1;justify-content:center" onclick="saveEdit()">✓ 保存修改</button>
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
    </div>
  </div>
</div>
<div class="toast ok" id="toast" style="display:none"></div>

<script>
const SB   = 'https://lvdmqgyrgkzywoqvmjlh.supabase.co';
const PUB  = 'sb_publishable_DpiOMXxxnYckRosCz1lAgw_DUBO7EBF';
const SBH  = {'Content-Type':'application/json','apikey':PUB,'Prefer':'return=representation'};

let delTarget=null, currentListings=[];

// ── Toast / Status ────────────────────────────
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+type;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3200);
}
// ── Supabase ──────────────────────────────────
async function sbGet(t){const r=await fetch(SB+'/rest/v1/'+t+'?select=*&order=created_at.desc',{headers:SBH});return r.json()}
async function sbPost(t,d){const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:SBH,body:JSON.stringify(d)});return r.json()}
async function sbPatch(t,id,d){const r=await fetch(SB+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:SBH,body:JSON.stringify(d)});return r.json()}
async function sbDel(t,id){await fetch(SB+'/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE',headers:SBH})}

// ── Listings ──────────────────────────────────
function normAddr(a){return(a||'').toLowerCase().replace(/\s+/g,' ').trim()}
function isDup(addr){return currentListings.some(function(l){return normAddr(l.address)===normAddr(addr)})}

function saveManual(){
  const addr=document.getElementById('m-address').value.trim();
  if(!addr){toast('请填写地址','err');return}
  const isDupAddr=isDup(addr);
  if(isDupAddr){document.getElementById('dup-warn').style.display='block';if(!confirm('该地址已存在，确定继续发布？'))return}
  const data={
    address:addr,
    suburb:document.getElementById('m-suburb').value.trim(),
    bedrooms:parseInt(document.getElementById('m-bed').value)||0,
    bathrooms:parseInt(document.getElementById('m-bath').value)||0,
    garages:parseInt(document.getElementById('m-garage').value)||0,
    land_area:document.getElementById('m-land').value.trim(),
    building_area:document.getElementById('m-build').value.trim(),
    price:document.getElementById('m-price').value.trim(),
    image_url:document.getElementById('m-img').value.trim(),
    raywhite_url:document.getElementById('m-rw-url').value.trim(),
    description:document.getElementById('m-desc').value.trim()
  };
  sbPost('listings',data).then(()=>{
    toast('Listing 已发布！');
    ['m-address','m-suburb','m-bed','m-bath','m-garage','m-land','m-build','m-price','m-img','m-rw-url','m-desc']
      .forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    document.getElementById('dup-warn').style.display='none';
    loadListings();
  }).catch(()=>toast('发布失败，请重试','err'));
}

// ── Edit Listing ──────────────────────────────
let editId=null;
function openEdit(id){
  const l=currentListings.find(x=>x.id===id);
  if(!l)return;
  editId=id;
  document.getElementById('e-address').value=l.address||'';
  document.getElementById('e-suburb').value=l.suburb||'';
  document.getElementById('e-bed').value=l.bedrooms||'';
  document.getElementById('e-bath').value=l.bathrooms||'';
  document.getElementById('e-garage').value=l.garages||'';
  document.getElementById('e-land').value=l.land_area||'';
  document.getElementById('e-build').value=l.building_area||'';
  document.getElementById('e-price').value=l.price||'';
  document.getElementById('e-img').value=l.image_url||'';
  document.getElementById('e-rw-url').value=l.raywhite_url||'';
  document.getElementById('e-desc').value=l.description||'';
  document.getElementById('edit-overlay').style.display='flex';
}
function closeEdit(){editId=null;document.getElementById('edit-overlay').style.display='none';}
async function saveEdit(){
  if(!editId)return;
  const addr=document.getElementById('e-address').value.trim();
  if(!addr){toast('地址不能为空','err');return}
  const btn=document.querySelector('#edit-overlay .btn-green');
  btn.innerHTML='<span class="spin"></span>保存中...';btn.disabled=true;
  try{
    await sbPatch('listings',editId,{
      address:addr,
      suburb:document.getElementById('e-suburb').value.trim(),
      bedrooms:parseInt(document.getElementById('e-bed').value)||0,
      bathrooms:parseInt(document.getElementById('e-bath').value)||0,
      garages:parseInt(document.getElementById('e-garage').value)||0,
      land_area:document.getElementById('e-land').value.trim(),
      building_area:document.getElementById('e-build').value.trim(),
      price:document.getElementById('e-price').value.trim(),
      image_url:document.getElementById('e-img').value.trim(),
      raywhite_url:document.getElementById('e-rw-url').value.trim(),
      description:document.getElementById('e-desc').value.trim()
    });
    toast('已保存！');closeEdit();loadListings();
  }catch(e){toast('保存失败，请重试','err');}
  btn.innerHTML='✓ 保存修改';btn.disabled=false;
}

async function loadListings(){
  try{
    const data=await sbGet('listings');
    currentListings=Array.isArray(data)?data:[];
    document.getElementById('lc').textContent=currentListings.length;
    const el=document.getElementById('listings-list');
    if(!currentListings.length){el.innerHTML='<div class="empty">暂无 Listing</div>';return}
    el.innerHTML=currentListings.map(function(l){
      return '<div class="list-item">'+
        (l.image_url?'<img class="list-thumb" src="'+l.image_url+'" onerror="this.style.opacity=\'.3\'" />'
          :'<div class="list-thumb"></div>')+
        '<div class="list-info">'+
        '<div class="list-title">'+(l.address||'无地址')+'</div>'+
        '<div class="list-meta">'+(l.suburb||'')+' · '+(l.bedrooms||0)+'房 '+(l.bathrooms||0)+'卫 · '+(l.price||'')+'</div>'+
        '</div>'+
        '<div class="list-actions">'+
        (l.raywhite_url?'<a class="list-link" href="'+l.raywhite_url+'" target="_blank" rel="noopener noreferrer" onclick="window.open(\''+l.raywhite_url+'\',\'_blank\');return false;">查看</a>':'')+
        '<button class="btn btn-ghost" style="font-size:12px;padding:5px 11px" onclick="openEdit(\''+l.id+'\')">编辑</button>'+
        '<button class="btn btn-danger" onclick="askDel(\'listings\',\''+l.id+'\',\''+
          (l.address||'').replace(/'/g,"\\'")+'\')">删除</button>'+
        '</div></div>';
    }).join('');
  }catch(e){document.getElementById('listings-list').innerHTML='<div class="empty">加载失败</div>';}
}


// ── Delete ────────────────────────────────────
function askDel(tbl,id,name){
  delTarget={tbl,id,name};
  document.getElementById('modal-body').textContent='确定要删除「'+name+'」吗？此操作无法撤销。';
  document.getElementById('modal').style.display='flex';
}
async function doDelete(){
  if(!delTarget)return;
  await sbDel(delTarget.tbl,delTarget.id);
  toast('已删除');closeModal();
  loadListings();
}
function closeModal(){delTarget=null;document.getElementById('modal').style.display='none'}

loadListings();
</script>
</body>
</html>
